name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: ultra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Full test suite
        run: python -m pytest -q -p no:cacheprovider

  docker-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ultra
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file (no .env present)
        run: docker compose config -q
      - name: Build image
        run: docker build -t ultra-trading-platform:ci .
      - name: "Smoke: image reports its version"
        run: docker run --rm ultra-trading-platform:ci python -c "from src.utils.version import get_version; print('ULTRA', get_version())"
